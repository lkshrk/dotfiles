# Installed to /etc/keyd/default.conf by setup-omarchy.sh.
# Caps Lock becomes Hyper: held, it acts as SUPER + CTRL + ALT (the Mac's
# Cmd + Ctrl + Opt), which bindings.lua uses for the skhd shortcuts.
# Tapped alone it does nothing.

[ids]
*

[main]
capslock = layer(hyper)
leftalt = layer(umlaut)

[hyper:C-A-M]

# Left Alt stays Alt, except a/o/u/s send AltGr so the layout's ä/ö/ü/ß arrive as text in every app.
[umlaut:A]
a = G-a
o = G-o
u = G-u
s = G-s
