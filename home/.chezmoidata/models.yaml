    - {id: anthropic-auto, name: Anthropic Auto, family: other, context: 1000000, output: 128000, image: false, reasoning: false}
    - {id: openai-auto, name: OpenAI Auto, family: other, context: 922000, output: 128000, image: false, reasoning: false}
