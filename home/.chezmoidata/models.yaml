    - {id: anthropic/claude-sonnet, name: Claude Sonnet, family: anthropic, context: 1000000, output: 128000, image: true, reasoning: true}
    - {id: anthropic/claude-haiku, name: Claude Haiku, family: anthropic, context: 200000, output: 64000, image: true, reasoning: true}
    - {id: openai/gpt-astra, name: GPT Astra, family: openai, context: 922000, output: 128000, image: true, reasoning: true}
    - {id: openai/gpt-sol, name: GPT Sol, family: openai, context: 922000, output: 128000, image: true, reasoning: true}
    - {id: openai/gpt-terra, name: GPT Terra, family: openai, context: 922000, output: 128000, image: true, reasoning: true}
