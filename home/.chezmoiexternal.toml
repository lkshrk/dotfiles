# Pulled on the first apply after a week, and on every `scripts/update.sh` (chezmoi update --refresh-externals).
[".oh-my-zsh"]
type = "git-repo"
url = "https://github.com/ohmyzsh/ohmyzsh.git"
refreshPeriod = "168h"
clone.args = ["--depth", "1"]
pull.args = ["--ff-only"]

[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
type = "git-repo"
url = "https://github.com/zsh-users/zsh-autosuggestions.git"
refreshPeriod = "168h"
clone.args = ["--depth", "1"]
pull.args = ["--ff-only"]

[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
type = "git-repo"
url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
refreshPeriod = "168h"
clone.args = ["--depth", "1"]
pull.args = ["--ff-only"]

[".local/share/tmux/plugins/tmux-resurrect"]
type = "git-repo"
url = "https://github.com/tmux-plugins/tmux-resurrect.git"
refreshPeriod = "168h"
clone.args = ["--depth", "1"]
pull.args = ["--ff-only"]

[".local/share/tmux/plugins/tmux-continuum"]
type = "git-repo"
url = "https://github.com/tmux-plugins/tmux-continuum.git"
refreshPeriod = "168h"
clone.args = ["--depth", "1"]
pull.args = ["--ff-only"]
