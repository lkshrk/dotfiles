# Cloned once; `scripts/update.sh` pulls them (chezmoi apply --refresh-externals).
[".oh-my-zsh"]
type = "git-repo"
url = "https://github.com/ohmyzsh/ohmyzsh.git"
clone.args = ["--depth", "1"]
pull.args = ["--ff-only"]

[".oh-my-zsh/custom/plugins/zsh-autosuggestions"]
type = "git-repo"
url = "https://github.com/zsh-users/zsh-autosuggestions.git"
clone.args = ["--depth", "1"]
pull.args = ["--ff-only"]

[".oh-my-zsh/custom/plugins/zsh-syntax-highlighting"]
type = "git-repo"
url = "https://github.com/zsh-users/zsh-syntax-highlighting.git"
clone.args = ["--depth", "1"]
pull.args = ["--ff-only"]

[".local/share/tmux/plugins/tmux-resurrect"]
type = "git-repo"
url = "https://github.com/tmux-plugins/tmux-resurrect.git"
clone.args = ["--depth", "1"]
pull.args = ["--ff-only"]

[".local/share/tmux/plugins/tmux-continuum"]
type = "git-repo"
url = "https://github.com/tmux-plugins/tmux-continuum.git"
clone.args = ["--depth", "1"]
pull.args = ["--ff-only"]

["Dev/omarchy-stats"]
type = "git-repo"
url = "https://github.com/lkshrk/omarchy-stats"
pull.args = ["--ff-only"]

["Dev/omarchy-quotatank"]
type = "git-repo"
url = "https://github.com/JanitorHead/omarchy-quotatank.git"
pull.args = ["--ff-only"]
