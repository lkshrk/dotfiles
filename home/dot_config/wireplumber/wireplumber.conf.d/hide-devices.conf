# Hide devices nothing should pick: GPU and iGPU HDMI audio, the unused onboard ALC897, and the RODE headphone jack.

device.profile.priority.rules = [
  {
    matches = [
      { device.name = "alsa_card.pci-0000_01_00.1" }
      { device.name = "alsa_card.pci-0000_16_00.1" }
      { device.name = "alsa_card.pci-0000_16_00.6" }
    ]
    actions = { update-props = { priorities = [ "off" ] } }
  }
  {
    matches = [ { device.name = "alsa_card.usb-RODE_Microphones_RODE_NT-USB-00" } ]
    actions = { update-props = { priorities = [ "input:analog-stereo" ] } }
  }
]
