# Applied by keyd-application-mapper on top of /etc/keyd/mac.conf while a matching window has focus.
# As in Ghostty on macOS, Cmd never reaches the program: it maps to terminal actions or does nothing, and Ctrl stays Ctrl.
# Option combos send Alt as Ghostty does on macOS (macos-option-as-alt), so tmux.conf works unchanged on both.
[foot*]
cmd.c = C-S-c
cmd.v = macro2(0, 0, C-S-v)
cmd.backspace = C-u
cmd.w = macro2(0, 0, C-A-M-w)
cmd.n = macro2(0, 0, C-S-n)
cmd.f = macro2(0, 0, C-S-r)
cmd.a = noop
cmd.b = noop
cmd.d = noop
cmd.e = noop
cmd.g = noop
cmd.i = noop
cmd.j = noop
cmd.k = noop
cmd.l = noop
cmd.o = noop
cmd.p = noop
cmd.r = noop
cmd.s = noop
cmd.t = noop
cmd.u = noop
cmd.x = noop
cmd.y = noop
cmd.z = noop
option.left = A-b
option.right = A-f
option.backspace = C-w
option.2 = A-2
option.3 = A-3
option.4 = A-4
control+option.left = C-A-left
control+option.right = C-A-right
option+shift.left = A-S-left
option+shift.right = A-S-right
control+option+shift.left = C-A-S-left
control+option+shift.right = C-A-S-right

