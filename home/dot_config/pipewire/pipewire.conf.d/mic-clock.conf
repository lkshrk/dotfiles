# A USB mic driving the mic graph takes the clock with it on a replug; this timer outlives any device.
context.objects = [
    { factory = spa-node-factory
        args = {
            factory.name    = support.node.driver
            node.name       = mic-clock
            node.group      = mic-clock
            priority.driver = 30000
        }
        condition = [ { core.daemon = true } ]
    }
]
