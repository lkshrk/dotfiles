# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json
# Lefthook config for the dotfiles repo.
# chezmoi runs lefthook install when this file changes.

pre-commit:
  commands:
    agent-paths:
      run: python3 scripts/check-agent-paths.py
    gitleaks:
      run: gitleaks protect --staged --redact

pre-push:
  parallel: true
  commands:
    agent-run-smoke:
      run: sh tests/agent-run-smoke.sh
    check-agent-paths:
      run: python3 tests/check-agent-paths.py
    check-shell-clones:
      run: bash tests/check-shell-clones.sh
    env-smoke:
      run: sh tests/env-smoke.sh
    gateway-models:
      run: sh tests/gateway-models.sh
    gii-union:
      run: bash tests/gii-union.sh
    hypr-focus-app:
      run: bash tests/hypr-focus-app.sh
    hypr-screens-decide:
      run: lua tests/hypr-screens-decide.lua
    hypr-screens-snap:
      run: lua tests/hypr-screens-snap.lua
    local-agents-token:
      run: python3 tests/local-agents-token.py
    nvim-omarchy-theme:
      run: bash tests/nvim-omarchy-theme.sh
    opencode-config-smoke:
      run: sh tests/opencode-config-smoke.sh
    package-lists:
      run: bash tests/package-lists.sh
    rbw-unlock-once:
      run: bash tests/rbw-unlock-once.sh
    render-hosts:
      run: bash tests/render-hosts.sh
    repository-git-hooks:
      run: python3 tests/repository-git-hooks.py
    tmux-omarchy-theme:
      run: bash tests/tmux-omarchy-theme.sh
    yabai-focus-app:
      run: bash tests/yabai-focus-app.sh
    yabai-obsidian-layout:
      run: bash tests/yabai-obsidian-layout.sh
    yabai-pip-placement:
      run: bash tests/yabai-pip-placement.sh
    yabai-window-created:
      run: bash tests/yabai-window-created.sh
