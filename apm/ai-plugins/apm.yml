name: ai-plugins
version: 1.0.0
description: Shared Omni agent dependencies (plugins, MCP servers) for every apm-managed host.
dependencies:
  apm:
  - git: ShiplightAI/agent-skills-v2
    path: shiplight
  - git: anthropics/claude-plugins-official
    path: external_plugins/github
    targets:
    - claude
  - git: anthropics/claude-plugins-official
    path: plugins/claude-md-management
    targets:
    - claude
  - git: anthropics/claude-plugins-official
    path: plugins/code-simplifier
    targets:
    - claude
  - git: anthropics/claude-plugins-official
    path: plugins/plugin-dev
    targets:
    - claude
  - git: ayghri/i-have-adhd
    targets:
    - claude
  - git: lkshrk/useful-skills
  - path: ~/Dev/dotfiles/apm/omp-skills
    targets:
    - codex
  - git: obra/superpowers
    ref: 22f0b463e7a5e579904dd6211a520321035526f7
    targets:
    - claude
  - git: openai/codex-plugin-cc
    path: plugins/codex
    targets:
    - claude
  - git: revfactory/harness
    targets:
    - claude
  - git: sopaco/deepwiki-rs
    path: skills/smart-docs
    targets:
    - claude
  mcp:
  - name: codebase-memory-mcp
    targets: [claude, codex]
    registry: false
    transport: stdio
    command: codebase-memory-mcp
  - name: litellm-tools
    targets: [claude, omp]
    registry: false
    transport: http
    url: https://api.ai.h-cloud.lan/mcp/
    extra:
      headersHelper: ~/.config/env/bin/litellm-mcp-headers
      http_headers_helper: ~/.config/env/bin/litellm-mcp-headers
      headersHelperKeys: [x-litellm-api-key]
      required: true
  - name: openaiDeveloperDocs
    targets: [claude, codex]
    registry: false
    transport: http
    url: https://developers.openai.com/mcp
  - name: shiplight
    targets: [claude, codex]
    registry: false
    transport: stdio
    command: bunx
    args:
    - '@shiplightai/mcp@latest'
