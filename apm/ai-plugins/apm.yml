name: ai-plugins
version: 1.0.0
description: Shared Omni agent dependencies (plugins, MCP servers, LSP) for every apm-managed host.
dependencies:
  apm:
  - git: DietrichGebert/ponytail
    targets:
    - codex
  - git: JuliusBrussee/caveman
    ref: d262ab3882952a59312ff3537cd86d894523c5ab
    targets:
    - claude
  - git: ShiplightAI/agent-skills-v2
    path: shiplight
  - git: anthropics/claude-plugins-official
    path: external_plugins/github
    targets:
    - claude
  - git: anthropics/claude-plugins-official
    path: plugins/claude-md-management
    targets:
    - claude
  - git: anthropics/claude-plugins-official
    path: plugins/code-simplifier
    targets:
    - claude
  - git: ayghri/i-have-adhd
    targets:
    - claude
  - git: lkshrk/linear-ai
    ref: v2.0.0
  - git: lkshrk/useful-skills
  - git: mksglu/context-mode
    targets:
    - claude
    - codex
  - git: obra/superpowers
    ref: 2ce8aa15d05bd57213e6f746f953aafb7ded7a8b
    targets:
    - claude
  - git: openai/codex-plugin-cc
    path: plugins/codex
    targets:
    - claude
  - git: revfactory/harness
    targets:
    - claude
  - git: sopaco/deepwiki-rs
    path: skills/smart-docs
    targets:
    - claude
  lsp:
  - name: bash-language-server
    command: bash-language-server
    args:
    - start
    extensionToLanguage:
      .sh: shellscript
      .bash: shellscript
  - name: gopls
    command: gopls
    extensionToLanguage:
      .go: go
  - name: lua-language-server
    command: lua-language-server
    extensionToLanguage:
      .lua: lua
  - name: pyright
    command: pyright-langserver
    args:
    - --stdio
    extensionToLanguage:
      .py: python
      .pyi: python
  - name: rust-analyzer
    command: rust-analyzer
    extensionToLanguage:
      .rs: rust
  - name: sourcekit-lsp
    command: sourcekit-lsp
    extensionToLanguage:
      .swift: swift
  - name: terraform-ls
    command: terraform-ls
    args:
    - serve
    extensionToLanguage:
      .tf: terraform
      .tfvars: terraform-vars
  - name: yaml-language-server
    command: yaml-language-server
    args:
    - --stdio
    extensionToLanguage:
      .yaml: yaml
      .yml: yaml
  mcp:
  - name: codebase-memory-mcp
    registry: false
    transport: stdio
    command: codebase-memory-mcp
  - name: litellm-tools
    registry: false
    transport: http
    url: https://api.ai.h-cloud.lan/mcp/
    extra:
      headersHelper: ~/.config/env/bin/litellm-mcp-headers
      http_headers_helper: ~/.config/env/bin/litellm-mcp-headers
      required: true
  - name: openaiDeveloperDocs
    registry: false
    transport: http
    url: https://developers.openai.com/mcp
  - name: shiplight
    registry: false
    transport: stdio
    command: bunx
    args:
    - '@shiplightai/mcp@latest'
