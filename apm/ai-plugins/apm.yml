name: ai-plugins
version: 1.0.0
description: Shared agent dependencies (plugins, skills, MCP servers) for every host with the ai group.
dependencies:
  apm:
  - git: ShiplightAI/agent-skills-v2
    ref: 98b77bd5b69f9848f535602628e2f800711a438c
    path: shiplight
  - git: anthropics/claude-plugins-official
    ref: b5b01ac4f889fec0c4c6bb89f27ca7c8574473f6
    path: external_plugins/github
    targets:
    - claude
  - git: anthropics/claude-plugins-official
    ref: b5b01ac4f889fec0c4c6bb89f27ca7c8574473f6
    path: plugins/claude-md-management
    targets:
    - claude
  - git: anthropics/claude-plugins-official
    ref: b5b01ac4f889fec0c4c6bb89f27ca7c8574473f6
    path: plugins/code-simplifier
    targets:
    - claude
  - git: anthropics/claude-plugins-official
    ref: b5b01ac4f889fec0c4c6bb89f27ca7c8574473f6
    path: plugins/plugin-dev
    targets:
    - claude
  - git: ayghri/i-have-adhd
    ref: 1ecea1993b7fce257ffbd686c070948b5e07eda6
    targets:
    - claude
  - git: lkshrk/useful-skills
    ref: 36f406f557790afebac0c9f858de4b2e3da21b60
  - path: ~/Dev/dotfiles/apm/omp-skills
    targets:
    - codex
  - git: obra/superpowers
    ref: 22f0b463e7a5e579904dd6211a520321035526f7
    targets:
    - claude
  - git: openai/codex-plugin-cc
    ref: db52e28f4d9ded852ab3942cea316258ae4ef346
    path: plugins/codex
    targets:
    - claude
  - git: revfactory/harness
    ref: 92d9f1b29e7af81acebf51a9fcd1832e739a1414
    targets:
    - claude
  - git: sopaco/deepwiki-rs
    ref: d0a009163938b561ef14b09a3a7ac671edc54041
    path: skills/smart-docs
    targets:
    - claude
  mcp:
  - name: codebase-memory-mcp
    targets: [claude, codex]
    registry: false
    transport: stdio
    command: codebase-memory-mcp
  - name: litellm-tools
    targets: [claude, codex, omp]
    registry: false
    transport: http
    url: https://api.ai.h-cloud.lan/mcp/
    headers:
      x-litellm-api-key: ${LITELLM_API}
  - name: openaiDeveloperDocs
    targets: [claude, codex]
    registry: false
    transport: http
    url: https://developers.openai.com/mcp
  - name: shiplight
    targets: [claude, codex]
    registry: false
    transport: stdio
    command: npx
    args:
    - -y
    - '@shiplightai/mcp@latest'
    env:
      PWDEBUG: console
