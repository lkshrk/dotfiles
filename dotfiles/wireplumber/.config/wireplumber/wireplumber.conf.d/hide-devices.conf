# Hide devices nothing should pick directly: GPU HDMI audio, the RODE headphone jack, and the raw RODE (it only feeds "Mic (filtered)").

device.profile.priority.rules = [
  {
    matches = [ { device.name = "alsa_card.pci-0000_01_00.1" } ]
    actions = { update-props = { priorities = [ "off" ] } }
  }
  {
    matches = [ { device.name = "alsa_card.usb-RODE_Microphones_RODE_NT-USB-00" } ]
    actions = { update-props = { priorities = [ "input:analog-stereo" ] } }
  }
]

monitor.alsa.rules = [
  {
    matches = [ { node.name = "alsa_input.usb-RODE_Microphones_RODE_NT-USB-00.analog-stereo" } ]
    actions = { update-props = { media.class = "Audio/Source/Internal" } }
  }
]
