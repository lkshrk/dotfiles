# The Razer mic follows the RODE's clock in "Mic (filtered)" and xruns constantly with the default buffer.

monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.usb-1532_Razer_BlackShark_V2_Pro.*" } ]
    actions = { update-props = { api.alsa.period-size = 1024, api.alsa.headroom = 1024 } }
  }
]
