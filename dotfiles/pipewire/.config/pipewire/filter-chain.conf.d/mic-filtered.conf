# "Mic (filtered)": the RODE, or the Razer headset while you're out of the RODE's range.

context.modules = [
  # One capture stream per filter chain, so both mics travel as separate channels of one source.
  {
    name = libpipewire-module-combine-stream
    args = {
      combine.mode = source
      node.name = "mics_split"
      node.description = "Mics (RODE + Razer)"
      combine.latency-compensate = false
      combine.props = {
        audio.position = [ AUX0 AUX1 ]
        media.class = "Audio/Source/Internal"
      }
      stream.rules = [
        {
          matches = [ { node.name = "alsa_input.usb-RODE_Microphones_RODE_NT-USB-00.analog-stereo" } ]
          actions = {
            create-stream = {
              audio.position = [ FL ]
              combine.audio.position = [ AUX0 ]
            }
          }
        }
        {
          matches = [ { node.name = "alsa_input.usb-1532_Razer_BlackShark_V2_Pro_2.4_O001000007-00.mono-fallback" } ]
          actions = {
            create-stream = {
              audio.position = [ MONO ]
              combine.audio.position = [ AUX1 ]
            }
          }
        }
      ]
    }
  }
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "Mic (filtered)"
      media.name = "Mic (filtered)"
      filter.graph = {
        nodes = [
          # Per-mic tone: high-pass first, then each mic's own voicing.
          {
            type = builtin name = desk_eq label = param_eq
            config = {
              filters = [
                { type = bq_highpass freq = 80.0 q = 0.7 }
                { type = bq_peaking freq = 250.0 gain = -2.5 q = 1.0 }
                { type = bq_peaking freq = 4000.0 gain = 2.0 q = 1.0 }
                { type = bq_highshelf freq = 10000.0 gain = 1.5 q = 0.7 }
              ]
            }
          }
          {
            type = builtin name = head_eq label = param_eq
            config = {
              filters = [
                { type = bq_highpass freq = 100.0 q = 0.7 }
                { type = bq_peaking freq = 4000.0 gain = 2.0 q = 1.0 }
              ]
            }
          }

          # Headset level over RODE level, as smoothed power; the headset's fixed mouth distance makes it a distance gauge.
          { type = builtin name = head_sq label = mult }
          { type = builtin name = desk_sq label = mult }
          { type = builtin name = head_pow label = bq_lowpass control = { "Freq" = 3.0 "Q" = 0.7 } }
          { type = builtin name = desk_pow label = bq_lowpass control = { "Freq" = 3.0 "Q" = 0.7 } }
          # -60 dB floor so silence (headset noise ~-62 dB) never reads as "away".
          { type = builtin name = desk_floor label = linear control = { "Mult" = 1.0 "Add" = 0.000001 } }
          { type = builtin name = desk_inv label = recip }
          { type = builtin name = ratio label = mult }
          # Scaled so 0.1 (-20 dB) is a headset 12 dB louder than the RODE (power 15.8x); measured seated -12..+11 dB, away +14..+21 dB.
          { type = builtin name = away_key label = linear control = { "Mult" = 0.00631 "Add" = 0.0 } }
          { type = builtin name = away_cap label = clamp control = { "Min" = 0.0 "Max" = 1.0 } }

          # Away mask: 1.0 while the key holds above -20 dB, released below -26 dB (6 dB louder); LSP gains are linear.
          { type = builtin name = one label = sine control = { "Freq" = 0.0 "Ampl" = 0.0 "Offset" = 1.0 } }
          {
            type = lv2 name = away plugin = "http://lsp-plug.in/plugins/lv2/sc_gate_mono"
            control = {
              "sci" = 1
              "scm" = 0
              "gt" = 0.1
              "gz" = 1.0
              "gh" = 1
              "ht" = 0.5
              "hz" = 1.0
              "gr" = 0.000251
              "at" = 50.0
              "hold" = 1500.0
              "rt" = 300.0
            }
          }
          { type = builtin name = desk_mask label = linear control = { "Mult" = -1.0 "Add" = 1.0 } }
          { type = builtin name = desk_gain label = mult }
          { type = builtin name = head_gain label = mult }
          # -6 dB headroom so the EQ boosts can't clip DeepFilterNet's input.
          { type = builtin name = mix label = mixer control = { "Gain 1" = 0.5 "Gain 2" = 0.5 } }

          # Shared cleanup: only one mic is live at a time, so one instance of each stage is enough.
          {
            type = ladspa name = denoise plugin = libdeep_filter_ladspa label = deep_filter_mono
            control = {
              "Attenuation Limit (dB)" = 50.0
              "Min processing threshold (dB)" = -10.0
              "Max ERB processing threshold (dB)" = 35.0
              "Max DF processing threshold (dB)" = 35.0
              "Post Filter Beta" = 0.05
            }
          }
          # Speech detector only: its output is silent unless RNNoise is this sure it hears a voice.
          {
            type = ladspa name = vad plugin = librnnoise_ladspa label = noise_suppressor_mono
            control = {
              "VAD Threshold (%)" = 85
              "VAD Grace Period (ms)" = 200
              "Retroactive VAD Grace (ms)" = 0
            }
          }
          # Keyed by the speech detector; gt -48 dB, gr -30 dB, ht -6 dB, zones -3 dB.
          {
            type = lv2 name = gate plugin = "http://lsp-plug.in/plugins/lv2/sc_gate_mono"
            control = {
              "sci" = 1
              "scm" = 1
              "scr" = 30.0
              "sla" = 5.0
              "shpm" = 2
              "shpf" = 250.0
              "slpm" = 2
              "slpf" = 3500.0
              "gt" = 0.00398
              "gz" = 0.708
              "gh" = 1
              "ht" = 0.5
              "hz" = 0.708
              "gr" = 0.0316
              "at" = 5.0
              "rt" = 200.0
              "hold" = 100.0
            }
          }
          # th 0.05 = -26 dB, kn 0.5 = -6 dB, mk 5.01 = +14 dB, both offset by the mix headroom.
          {
            type = lv2 name = comp plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
            control = {
              "al" = 0.05
              "cr" = 3.0
              "kn" = 0.5
              "at" = 10.0
              "rt" = 120.0
              "mk" = 5.01
            }
          }
          {
            type = lv2 name = limit plugin = "http://gareus.org/oss/lv2/dpl#mono"
            control = {
              "threshold" = -1.0
              "release" = 0.05
              "truepeak" = 1
            }
          }
        ]
        links = [
          { output = "head_eq:Out 1" input = "head_sq:In 1" }
          { output = "head_eq:Out 1" input = "head_sq:In 2" }
          { output = "desk_eq:Out 1" input = "desk_sq:In 1" }
          { output = "desk_eq:Out 1" input = "desk_sq:In 2" }
          { output = "head_sq:Out" input = "head_pow:In" }
          { output = "desk_sq:Out" input = "desk_pow:In" }
          { output = "desk_pow:Out" input = "desk_floor:In" }
          { output = "desk_floor:Out" input = "desk_inv:In" }
          { output = "head_pow:Out" input = "ratio:In 1" }
          { output = "desk_inv:Out" input = "ratio:In 2" }
          { output = "ratio:Out" input = "away_key:In" }
          { output = "away_key:Out" input = "away_cap:In" }
          { output = "away_cap:Out" input = "away:sc" }
          { output = "one:Out" input = "away:in" }
          { output = "away:out" input = "desk_mask:In" }
          { output = "away:out" input = "head_gain:In 2" }
          { output = "head_eq:Out 1" input = "head_gain:In 1" }
          { output = "desk_eq:Out 1" input = "desk_gain:In 1" }
          { output = "desk_mask:Out" input = "desk_gain:In 2" }
          { output = "desk_gain:Out" input = "mix:In 1" }
          { output = "head_gain:Out" input = "mix:In 2" }
          { output = "mix:Out" input = "denoise:Audio In" }
          { output = "mix:Out" input = "vad:Input" }
          { output = "vad:Output" input = "gate:sc" }
          { output = "denoise:Audio Out" input = "gate:in" }
          { output = "gate:out" input = "comp:in" }
          { output = "comp:out" input = "limit:in" }
        ]
        inputs = [ "desk_eq:In 1" "head_eq:In 1" ]
        outputs = [ "limit:out" ]
      }
      capture.props = {
        node.name = "mic_filtered_capture"
        target.object = "mics_split"
        audio.position = [ AUX0 AUX1 ]
        stream.dont-remix = true
        # Not passive: it reads a virtual node, and passive links never wake mics_split, so the chain stalled silent.
        node.passive = false
      }
      playback.props = {
        node.name = "mic_filtered"
        node.description = "Mic (filtered)"
        media.class = "Audio/Source"
        audio.position = [ MONO ]
        priority.session = 2500
      }
    }
  }
]
