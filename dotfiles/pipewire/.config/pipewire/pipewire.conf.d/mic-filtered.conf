# "Mic (filtered)": the desk RODE, or the Razer headset whenever it is on and unmuted, cleaned up in one chain.
# The headset dongle stays plugged in, but sends exact silence while the headset is muted or off; that switches mics.

context.modules = [
  # One capture stream per filter chain, so both mics travel as separate channels of one source.
  {
    name = libpipewire-module-combine-stream
    args = {
      combine.mode = source
      node.name = "mics_split"
      node.description = "Mics (RODE + Razer)"
      combine.latency-compensate = false
      combine.props = {
        audio.position = [ AUX0 AUX1 ]
        node.passive = true
        media.class = "Audio/Source/Internal"
      }
      stream.rules = [
        {
          matches = [ { node.name = "alsa_input.usb-RODE_Microphones_RODE_NT-USB-00.analog-stereo" } ]
          actions = {
            create-stream = {
              audio.position = [ FL ]
              combine.audio.position = [ AUX0 ]
            }
          }
        }
        {
          matches = [ { node.name = "alsa_input.usb-1532_Razer_BlackShark_V2_Pro_2.4_O001000007-00.mono-fallback" } ]
          actions = {
            create-stream = {
              audio.position = [ MONO ]
              combine.audio.position = [ AUX1 ]
            }
          }
        }
      ]
    }
  }
  {
    name = libpipewire-module-filter-chain
    args = {
      node.description = "Mic (filtered)"
      media.name = "Mic (filtered)"
      filter.graph = {
        nodes = [
          { type = builtin name = desk_in label = copy }
          { type = builtin name = head_in label = copy }

          # Per-mic tone: high-pass first, then each mic's own voicing.
          {
            type = builtin name = desk_eq label = param_eq
            config = {
              filters = [
                { type = bq_highpass freq = 80.0 q = 0.7 }
                { type = bq_peaking freq = 250.0 gain = -2.5 q = 1.0 }
                { type = bq_peaking freq = 4000.0 gain = 2.0 q = 1.0 }
                { type = bq_highshelf freq = 10000.0 gain = 1.5 q = 0.7 }
              ]
            }
          }
          {
            type = builtin name = head_eq label = param_eq
            config = {
              filters = [
                { type = bq_highpass freq = 100.0 q = 0.7 }
                { type = bq_peaking freq = 4000.0 gain = 2.0 q = 1.0 }
              ]
            }
          }

          # Headset-live mask: a constant 1.0 gated by the headset's own level, so it reads 1 while the headset carries noise and ~0 on its exact silence (muted or off).
          # LSP gains are linear: 0.000178 = -75 dB sits between the live noise floor (about -62 dB) and mute (-90 dB); gr 0.000251 = -72 dB is the deepest it closes.
          { type = builtin name = one label = sine control = { "Freq" = 0.0 "Ampl" = 0.0 "Offset" = 1.0 } }
          {
            type = lv2 name = head_live plugin = "http://lsp-plug.in/plugins/lv2/sc_gate_mono"
            control = {
              "sci" = 1
              "scm" = 0
              "gt" = 0.000178
              "gz" = 1.0
              "gh" = 1
              "ht" = 0.5
              "hz" = 1.0
              "gr" = 0.000251
              "at" = 20.0
              "hold" = 1000.0
              "rt" = 300.0
            }
          }
          { type = builtin name = desk_mask label = linear control = { "Mult" = -1.0 "Add" = 1.0 } }
          { type = builtin name = desk_gain label = mult }
          { type = builtin name = head_gain label = mult }
          { type = builtin name = mix label = mixer control = { "Gain 1" = 1.0 "Gain 2" = 1.0 } }

          # Shared cleanup: only one mic is live at a time, so one instance of each stage is enough.
          {
            type = ladspa name = denoise plugin = libdeep_filter_ladspa label = deep_filter_mono
            control = {
              "Attenuation Limit (dB)" = 35.0
              "Min processing threshold (dB)" = -10.0
              "Max ERB processing threshold (dB)" = 35.0
              "Max DF processing threshold (dB)" = 35.0
              "Post Filter Beta" = 0.05
            }
          }
          # LSP gains are linear: gt 0.00178 = -55 dB, gr 0.0316 = -30 dB, ht 0.5 = -6 dB, zones 0.708 = -3 dB.
          {
            type = lv2 name = gate plugin = "http://lsp-plug.in/plugins/lv2/gate_mono"
            control = {
              "gt" = 0.00178
              "gz" = 0.708
              "gh" = 1
              "ht" = 0.5
              "hz" = 0.708
              "gr" = 0.0316
              "at" = 5.0
              "rt" = 200.0
              "hold" = 100.0
            }
          }
          # th 0.1 = -20 dB, kn 0.5 = -6 dB, mk 2.51 = +8 dB.
          {
            type = lv2 name = comp plugin = "http://lsp-plug.in/plugins/lv2/compressor_mono"
            control = {
              "al" = 0.1
              "cr" = 3.0
              "kn" = 0.5
              "at" = 10.0
              "rt" = 120.0
              "mk" = 2.51
            }
          }
          {
            type = lv2 name = limit plugin = "http://gareus.org/oss/lv2/dpl#mono"
            control = {
              "threshold" = -1.0
              "release" = 0.05
              "truepeak" = 1
            }
          }
          { type = builtin name = out_l label = copy }
        ]
        links = [
          { output = "desk_in:Out" input = "desk_eq:In 1" }
          { output = "head_in:Out" input = "head_eq:In 1" }
          { output = "head_in:Out" input = "head_live:sc" }
          { output = "one:Out" input = "head_live:in" }
          { output = "head_live:out" input = "desk_mask:In" }
          { output = "head_live:out" input = "head_gain:In 2" }
          { output = "head_eq:Out 1" input = "head_gain:In 1" }
          { output = "desk_eq:Out 1" input = "desk_gain:In 1" }
          { output = "desk_mask:Out" input = "desk_gain:In 2" }
          { output = "desk_gain:Out" input = "mix:In 1" }
          { output = "head_gain:Out" input = "mix:In 2" }
          { output = "mix:Out" input = "denoise:Audio In" }
          { output = "denoise:Audio Out" input = "gate:in" }
          { output = "gate:out" input = "comp:in" }
          { output = "comp:out" input = "limit:in" }
          { output = "limit:out" input = "out_l:In" }
        ]
        inputs = [ "desk_in:In" "head_in:In" ]
        outputs = [ "out_l:Out" ]
      }
      capture.props = {
        node.name = "mic_filtered_capture"
        target.object = "mics_split"
        audio.position = [ AUX0 AUX1 ]
        stream.dont-remix = true
        node.passive = true
      }
      playback.props = {
        node.name = "mic_filtered"
        node.description = "Mic (filtered)"
        media.class = "Audio/Source"
        audio.position = [ MONO ]
        priority.session = 2500
      }
    }
  }
]
