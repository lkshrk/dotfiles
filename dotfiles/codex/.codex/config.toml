model_context_window = 1_000_000
model_auto_compact_token_limit = 840_000
model_auto_compact_token_limit_scope = "body_after_prefix"
model_reasoning_effort = "medium"
model_reasoning_summary = "detailed"
show_raw_agent_reasoning = true
# Coder's SSH pre-connect hook refreshes auth.json in the persistent workspace
# home, so credentials must stay file-backed.
cli_auth_credentials_store = "file"
approvals_reviewer = "auto_review"
approval_policy = "on-request"
default_permissions = "project-tools-docker"
model = "gpt-6-astra"

[agents]
max_concurrent_threads_per_session = 6
max_depth = 2

[permissions.project-tools-docker]
description = "Full project development with build tools, public/local networking, and Docker."

[permissions.project-tools-docker.filesystem]
":minimal" = "read"
":tmpdir" = "write"
":slash_tmp" = "write"
"~/.docker" = "write"
"~/.cache" = "write"
"~/Library/Caches" = "write"
"~/go/pkg/mod" = "write"

[permissions.project-tools-docker.filesystem.":workspace_roots"]
"." = "write"

[permissions.project-tools-docker.network]
enabled = true
allow_local_binding = true
dangerously_allow_all_unix_sockets = true

[permissions.project-tools-docker.network.domains]
"*" = "allow"
"localhost" = "allow"
"127.0.0.1" = "allow"
"::1" = "allow"

[otel]
environment = "dev"
log_user_prompt = true

[otel.exporter.otlp-http]
endpoint = "https://otel.h-cloud.lan/v1/logs"
protocol = "binary"

[otel.exporter.otlp-http.tls]
ca-certificate = "/Users/lkshrk/.local/share/certs/lan-ca.pem"

[otel.trace_exporter.otlp-http]
endpoint = "https://otel.h-cloud.lan/v1/traces"
protocol = "binary"

[otel.trace_exporter.otlp-http.tls]
ca-certificate = "/Users/lkshrk/.local/share/certs/lan-ca.pem"

[otel.metrics_exporter.otlp-http]
endpoint = "https://otel.h-cloud.lan/v1/metrics"
protocol = "binary"

[otel.metrics_exporter.otlp-http.tls]
ca-certificate = "/Users/lkshrk/.local/share/certs/lan-ca.pem"

[tui]
status_line = [
	"model-with-reasoning",
	"context-used",
	"used-tokens",
	"project-name",
	"git-branch",
	"five-hour-limit",
	"weekly-limit",
]

[tui.keymap.editor]
insert_newline = ["shift-enter"]
kill_line_start = ["ctrl-u"]

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4

