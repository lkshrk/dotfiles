model_context_window = 1_000_000
model_auto_compact_token_limit = 840_000
model_auto_compact_token_limit_scope = "body_after_prefix"
model_reasoning_effort = "medium"
model_reasoning_summary = "detailed"
show_raw_agent_reasoning = true
# The custom provider uses the gateway token helper, not stored ChatGPT OAuth.
cli_auth_credentials_store = "file"
approvals_reviewer = "auto_review"
approval_policy = "on-request"
default_permissions = "project-tools-docker"
model = "gpt-6-astra"
model_provider = "litellm"

[model_providers.litellm]
name = "LiteLLM"
base_url = "https://api.ai.h-cloud.lan/v1"
wire_api = "responses"

[model_providers.litellm.auth]
command = "sh"
args = ["-c", 'exec "${ENV_DIR:-${ENV_NEXT_DIR:-$HOME/.config/env}}/bin/llm-gateway-token"']
timeout_ms = 30000
refresh_interval_ms = 0

[agents]
max_concurrent_threads_per_session = 6
max_depth = 2

[permissions.project-tools-docker]
description = "Full project development with build tools, public/local networking, and Docker."

[permissions.project-tools-docker.filesystem]
":minimal" = "read"
":tmpdir" = "write"
":slash_tmp" = "write"
"~/.docker" = "write"
"~/.cache" = "write"
"~/Library/Caches" = "write"
"~/go/pkg/mod" = "write"

[permissions.project-tools-docker.filesystem.":workspace_roots"]
"." = "write"

[permissions.project-tools-docker.network]
enabled = true
allow_local_binding = true
dangerously_allow_all_unix_sockets = true

[permissions.project-tools-docker.network.domains]
"*" = "allow"
"localhost" = "allow"
"127.0.0.1" = "allow"
"::1" = "allow"

[tui]
status_line = [
	"model-with-reasoning",
	"context-used",
	"used-tokens",
	"project-name",
	"git-branch",
	"five-hour-limit",
	"weekly-limit",
]
screen_reader_detection_done = true

[tui.keymap.editor]
insert_newline = ["shift-enter"]
kill_line_start = ["ctrl-u"]

[tui.model_availability_nux]
"gpt-5.5" = 4
"gpt-5.6-sol" = 4
gpt-6-astra = 4
"gpt-6.1-sol" = 4

[mcp_servers.codebase-memory-mcp]
command = "codebase-memory-mcp"

[mcp_servers.codebase-memory-mcp.tools.delete_project]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.detect_changes]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.get_architecture]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.get_code_snippet]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.get_graph_schema]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.index_repository]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.index_status]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.ingest_traces]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.list_projects]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.manage_adr]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.query_graph]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.search_code]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.search_graph]
approval_mode = "approve"

[mcp_servers.codebase-memory-mcp.tools.trace_path]
approval_mode = "approve"

[mcp_servers.xcodebuildmcp]
command = "xcodebuildmcp"
args = ["mcp"]
enabled = false

[mcp_servers.litellm-tools]
url = "https://api.ai.h-cloud.lan/mcp/"

[mcp_servers.litellm-tools.env_http_headers]
x-litellm-api-key = "LITELLM_API"

[mcp_servers.shiplight]
command = "bunx"
args = ["@shiplightai/mcp@latest"]
startup_timeout_sec = 60.0

[mcp_servers.shiplight.env]
PWDEBUG = "console"

[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[mcp_servers.context-mode]
command = "sh"
args = ["-c", 'exec node "$HOME/.apm/apm_modules/mksglu/context-mode/start.mjs"']
id = ""

[mcp_servers.context-mode.env]

[plugins."superpowers@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = false

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = false

[plugins."presentations@openai-primary-runtime"]
enabled = false

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

