# Applied by keyd-application-mapper on top of /etc/keyd/mac.conf while a matching window has focus.
# Cmd + C would arrive as Ctrl + C and interrupt the running program, so terminals get their own copy/paste keys.
[foot*]
cmd.c = C-S-c
cmd.v = macro2(0, 0, C-S-v)
cmd.backspace = C-u
option.left = A-b
option.right = A-f
option.backspace = C-w

[alacritty]
cmd.c = C-S-c
cmd.v = macro2(0, 0, C-S-v)
cmd.backspace = C-u
option.left = A-b
option.right = A-f
option.backspace = C-w

[com-mitchellh-ghostty]
cmd.c = C-S-c
cmd.v = macro2(0, 0, C-S-v)
cmd.backspace = C-u
option.left = A-b
option.right = A-f
option.backspace = C-w

# ChatGPT web app: the desktop app's Cmd + N is Ctrl + Shift + O on chatgpt.com.
[chrome-chatgpt-com-default]
cmd.n = C-S-o
