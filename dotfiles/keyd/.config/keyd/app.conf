# Applied by keyd-application-mapper on top of /etc/keyd/mac.conf while a terminal has focus.
# Cmd + C would arrive as Ctrl + C and interrupt the running program, so terminals get their own copy/paste keys.
[foot]
cmd.c = C-S-c
cmd.v = C-S-v
cmd.backspace = C-u
option.left = A-b
option.right = A-f
option.backspace = C-w

[footclient]
cmd.c = C-S-c
cmd.v = C-S-v
cmd.backspace = C-u
option.left = A-b
option.right = A-f
option.backspace = C-w

[Alacritty]
