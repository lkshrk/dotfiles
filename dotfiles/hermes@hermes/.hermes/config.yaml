providers:
  litellm:
    api: http://litellm-proxy.ai.svc.cluster.local:4000/v1
    api_key: ${HERMES_CUSTOM_API_AI_H_CLOUD_LAN_API_KEY}
    transport: chat_completions
    default_model: gpt-5.6-sol
  litellm-anthropic:
    api: http://litellm-proxy.ai.svc.cluster.local:4000
    api_key: ${HERMES_CUSTOM_API_AI_H_CLOUD_LAN_API_KEY}
    transport: anthropic_messages
    default_model: claude-sonnet-5
    models:
      - claude-fable-5
      - claude-opus-5
      - claude-sonnet-5
      - claude-haiku-4-5-20251001
model:
  default: gpt-5.6-terra
  provider: custom:litellm
  base_url: http://litellm-proxy.ai.svc.cluster.local:4000
  database:
    journal_mode: wal
fallback:
  model: claude-sonnet-5
  provider: custom:litellm-anthropic
image_gen:
  provider: openrouter
  use_gateway: false
  model: google/gemini-3-pro-image
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  provider: openviking
  nudge_interval: 10
  flush_min_turns: 6
  openviking:
    use_ovcli_config: true
    ovcli_config_path: /home/hermes/.openviking/ovcli.conf.hermes
web:
  backend: searxng
  use_gateway: false
browser:
  inactivity_timeout: 120
  cloud_provider: camofox
  use_gateway: false
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
agent:
  max_turns: 150
  verbose: false
  reasoning_effort: medium
platform_toolsets:
  cli:
    - bfl
    - browser
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - image_gen
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  signal:
    - hermes-signal
SEARXNG_URL: http://searxng.ai.svc.cluster.local:8080
