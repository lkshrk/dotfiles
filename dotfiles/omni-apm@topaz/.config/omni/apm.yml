name: omni-migrated
version: 1.0.0
dependencies:
  apm:
  - git: DietrichGebert/ponytail
    targets:
    - codex
  - git: JuliusBrussee/caveman
    targets:
    - claude
  - git: ShiplightAI/agent-skills-v2
    path: shiplight
  - git: anthropics/claude-plugins-official
    path: external_plugins/github
    targets:
    - claude
  - git: anthropics/claude-plugins-official
    path: plugins/claude-md-management
    targets:
    - claude
  - git: anthropics/claude-plugins-official
    path: plugins/code-simplifier
    targets:
    - claude
  - git: ayghri/i-have-adhd
    targets:
    - claude
  - git: lkshrk/linear-ai
    ref: v1.6.1
  - git: lkshrk/useful-skills
  - git: mksglu/context-mode
    targets:
    - claude
    - codex
  - git: obra/superpowers
    ref: b36e0829c6d0140e93cfef2ca599b1b07d4a7797
    targets:
    - claude
  - git: openai/codex-plugin-cc
    path: plugins/codex
    targets:
    - claude
  - git: revfactory/harness
    targets:
    - claude
  - git: sopaco/deepwiki-rs
  lsp:
  - name: gopls
    command: gopls
    extensionToLanguage:
      .go: go
  mcp:
  - name: codebase-memory-mcp
    registry: false
    transport: stdio
    command: codebase-memory-mcp
  - name: context-mode
    registry: false
    transport: stdio
    command: node
    args:
    - ./start.mjs
  - name: litellm-tools
    registry: false
    transport: http
    url: https://api.ai.h-cloud.lan/mcp/
    headers:
      x-litellm-api-key: ${env:LITELLM_API}
  - name: shiplight
    registry: false
    transport: stdio
    command: bunx
    args:
    - '@shiplightai/mcp@latest'
targets:
- claude
- codex

