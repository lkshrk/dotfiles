name: omni-migrated
version: 1.0.0
dependencies:
  apm:
    - git: ShiplightAI/agent-skills-v2
    - git: lkshrk/linear-ai
    - git: lkshrk/useful-skills
    - git: sopaco/deepwiki-rs
    - name: caveman
      marketplace: caveman
      targets:
        - claude
    - name: claude-md-management
      marketplace: claude-plugins-official
      targets:
        - claude
    - name: code-simplifier
      marketplace: claude-plugins-official
      targets:
        - claude
    - name: codex
      marketplace: openai-codex
      targets:
        - claude
    - name: context-mode
      marketplace: context-mode
      targets:
        - claude
        - codex
    - name: github
      marketplace: claude-plugins-official
      targets:
        - claude
    - name: gopls-lsp
      marketplace: claude-plugins-official
      targets:
        - claude
    - name: harness
      marketplace: harness-marketplace
      targets:
        - claude
    - name: i-have-adhd
      marketplace: i-have-adhd
      targets:
        - claude
    - name: linear-ai
      marketplace: lkshrk
      targets:
        - codex
    - name: ponytail
      marketplace: ponytail
      targets:
        - codex
    - name: smart-docs
      marketplace: litellm
      targets:
        - claude
    - name: superpowers
      marketplace: claude-plugins-official
      targets:
        - claude
  mcp:
    - name: codebase-memory-mcp
      registry: false
      transport: stdio
      command: codebase-memory-mcp
    - name: context-mode
      registry: false
      transport: stdio
      command: node
      args:
        - ./start.mjs
    - name: litellm-tools
      registry: false
      transport: http
      url: https://api.ai.h-cloud.lan/mcp/
      headers:
        x-litellm-api-key: ${env:LITELLM_API}
    - name: shiplight
      registry: false
      transport: stdio
      command: bunx
      args:
        - '@shiplightai/mcp@latest'
targets:
  - claude
  - codex
