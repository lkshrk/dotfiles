onboarding = false

[experimental]
pane_history = false

[keys]
prefix = "ctrl+b"
focus_pane_left = "ctrl+alt+left"
focus_pane_right = "ctrl+alt+right"
focus_pane_up = "ctrl+alt+up"
focus_pane_down = "ctrl+alt+down"
split_horizontal = "prefix+h"
split_vertical = "prefix+v"
close_pane = "prefix+x"
resize_mode = "prefix+alt+r"
rename_tab = "prefix+r"
new_tab = "prefix+c"
close_tab = "prefix+k"
switch_tab = "alt+1..9"
previous_tab = "alt+left"
next_tab = "alt+right"
focus_agent = "prefix+1..9"
previous_agent = "prefix+p"
next_agent = "prefix+n"
rename_workspace = "prefix+shift+r"
new_workspace = "prefix+shift+c"
close_workspace = "prefix+shift+k"
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"
goto = "prefix+g"

[ui.toast]
delivery = "system"

[terminal]
default_shell = "zsh"
new_cwd = "follow"

[theme]
name = "tokyo-night"

[ui]
agent_panel_scope = "all"
