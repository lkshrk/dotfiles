onboarding = false

[experimental]
pane_history = false

[keys]
prefix = "ctrl+b"
focus_pane_left = "ctrl+alt+left"
focus_pane_right = "ctrl+alt+right"
focus_pane_up = "ctrl+alt+up"
focus_pane_down = "ctrl+alt+down"
split_horizontal = "prefix+h"
split_vertical = "prefix+v"
close_pane = "prefix+x"
resize_mode = "prefix+alt+r"
rename_tab = "prefix+r"
new_tab = "prefix+c"
close_tab = "prefix+k"
switch_tab = "alt+1..9"
previous_tab = "alt+left"
next_tab = "alt+right"
focus_agent = "prefix+1..9"
previous_agent = "prefix+p"
next_agent = "prefix+n"
rename_workspace = "prefix+shift+r"
new_workspace = "prefix+shift+c"
close_workspace = "prefix+shift+k"
previous_workspace = "prefix+shift+p"
next_workspace = "prefix+shift+n"
goto = "prefix+g"

[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "mirror.start"       # start / resume the daemon

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "mirror.pause"       # freeze syncing; start again to resume

[[keys.command]]
key = "prefix+shift+b"         # "bring back" (shift+r is native reload_config)
type = "plugin_action"
command = "mirror.restore"     # un-close mirrors you closed locally

[[keys.command]]
key = "prefix+alt+d"           # destructive: closes ALL mirrors + clears state
type = "plugin_action"
command = "mirror.teardown"    # stop mirroring everything (start to resume)

[[keys.command]]
key = "prefix+alt+n"           # native new_workspace = prefix+shift+n
type = "plugin_action"
command = "mirror.remote-new-workspace"

[[keys.command]]
key = "prefix+alt+c"           # native new_tab = prefix+c
type = "plugin_action"
command = "mirror.remote-new-tab"

[[keys.command]]
key = "prefix+alt+v"           # native split_vertical = prefix+v
type = "plugin_action"
command = "mirror.remote-split-right"

[[keys.command]]
key = "prefix+alt+minus"       # native split_horizontal = prefix+minus
type = "plugin_action"
command = "mirror.remote-split-down"

[ui.toast]
delivery = "system"

[terminal]
default_shell = "zsh"
new_cwd = "follow"

[theme]
name = "tokyo-night"

[ui]
agent_panel_sort = "spaces"
